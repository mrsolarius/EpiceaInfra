---
name: Infrastructure CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Validate
    runs-on: ubuntu-latest
    env:
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles  # rôle partagé app_stack
    steps:
      - uses: actions/checkout@v7
      - name: Vault chiffré
        run: head -1 ansible/secrets/vault.yml | grep -q '^\$ANSIBLE_VAULT' || { echo "vault.yml est en clair"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Ansible Lint
        run: ansible-lint ansible/
      # Pas de mot de passe du vault en CI : le modèle (mêmes clés, en clair) le remplace
      - name: Ansible Syntax Check
        run: >-
          ansible-playbook --syntax-check
          -e epicea_vault_file=../secrets/vault.yml.example
          ansible/playbooks/site.yml ansible/playbooks/backup.yml
