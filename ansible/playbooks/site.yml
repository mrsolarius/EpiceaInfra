---
- name: Epicea Infrastructure Deployment
  hosts: all
  become: true

  vars_files:
    - ../group_vars/common.yml
    - ../group_vars/versions.yml
    - ../secrets/vault.yml

  pre_tasks:
    - name: Vérification des prérequis
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "Ubuntu"
          - ansible_facts['distribution_major_version'] | int >= 22
        fail_msg: "Ce playbook nécessite Ubuntu 22.04 ou supérieur"

    - name: Afficher environnement détecté
      ansible.builtin.debug:
        msg:
          - "Environnement : {{ deploy_environment }}"
          - "GPU activé : {{ system_enable_gpu }}"
          - "Let's Encrypt : {{ proxy_enable_letsencrypt }}"

  roles:
    # Infrastructure de base
    - role: ../roles/common
      tags: [common, base]

    - role: ../roles/docker
      tags: [docker, base]

    - role: ../roles/storage
      tags: [storage, base]

    # Reverse proxy
    - role: ../roles/proxy
      tags: [proxy, services]
      when: "'traefik' in enabled_services"

    # Monitoring
    - role: ../roles/monitoring
      tags: [monitoring, services]
      when: "'monitoring' in enabled_services"

    # Services partagés (Redis)
    - role: ../roles/redis
      tags: [redis, database, services]
      when: "'redis' in enabled_services or 'shared-services' in enabled_services"

    # Applications
    - role: ../roles/apps/nextcloud
      tags: [nextcloud, services]
      when: "'nextcloud' in enabled_services"

    - role: ../roles/apps/immich
      tags: [immich, services]
      when: "'immich' in enabled_services"

    - role: ../roles/apps/jellyfin
      tags: [jellyfin, services]
      when: "'jellyfin' in enabled_services"

    - role: ../roles/apps/litopia
      tags: [litopia, services]
      when: "'litopia' in enabled_services"
  post_tasks:
    - name: Vérifier que tous les services sont up
      ansible.builtin.command:
        cmd: docker ps --filter "name={{ item }}" --format "{{ '{{' }}.Names{{ '}}' }}"
      loop:
        - traefik
        - prometheus
        - grafana
        - nextcloud-db
        - immich-db
        - redis
        - nextcloud
        - immich-server
        - jellyfin
        - litopia-db
        - litopia-back
        - litopia-front
      register: services_check
      changed_when: false
      failed_when: false

    - name: Résumé du déploiement
      ansible.builtin.debug:
        msg:
          - "================================================"
          - "✅ Déploiement terminé avec succès !"
          - "================================================"
          - "Services déployés : {{ enabled_services | join(', ') }}"
          - "Environnement : {{ deploy_environment }}"
          - ""
          - "🔧 Accès services :"
          - "  Traefik   : {{ 'https' if proxy_enable_letsencrypt else 'http' }}://{{ service_domains.traefik }}"
          - "  Grafana   : {{ 'https' if proxy_enable_letsencrypt else 'http' }}://{{ service_domains.grafana }}"
          - "  Nextcloud : {{ 'https' if proxy_enable_letsencrypt else 'http' }}://{{ service_domains.nextcloud }}"
          - "  Immich    : {{ 'https' if proxy_enable_letsencrypt else 'http' }}://{{ service_domains.immich }}"
          - "  Jellyfin  : {{ 'https' if proxy_enable_letsencrypt else 'http' }}://{{ service_domains.jellyfin }}"
          - "🐳 Services actifs :"
          - "{% for service in services_check.results %}  - {{ service.stdout | default('NOT RUNNING') }}{% endfor %}"
          - ""
          - "Prochaines étapes :"
          - "  make status  # Vérifier les services"
          - "  make logs    # Voir les logs"
