---
- name: Epicea Infrastructure Deployment
  hosts: production
  become: true

  # Les variables viennent de inventory/group_vars (all/, puis production.yml)
  vars_files:
    - ../secrets/vault.yml

  pre_tasks:
    - name: Vérification des prérequis
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "Ubuntu"
          - ansible_facts['distribution_major_version'] | int >= 22
        fail_msg: "Ce playbook nécessite Ubuntu 22.04 ou supérieur"

    - name: Afficher environnement détecté
      ansible.builtin.debug:
        msg:
          - "Environnement : {{ deploy_environment }}"
          - "Let's Encrypt : {{ proxy_enable_letsencrypt }}"

  roles:
    # Infrastructure de base
    - role: ../roles/common
      tags: [common, base]

    # zfs avant docker : Docker ne démarre que si tous les pools sont importés
    - role: ../roles/zfs
      tags: [zfs, storage, base]

    - role: ../roles/docker
      tags: [docker, base]

    - role: ../roles/storage
      tags: [storage, base]

    # Reverse proxy
    - role: ../roles/proxy
      tags: [proxy, services]
      when: "'traefik' in enabled_services"

    # Monitoring
    - role: ../roles/monitoring
      tags: [monitoring, services]
      when: "'monitoring' in enabled_services"

    # Services partagés (Redis)
    - role: ../roles/redis
      tags: [redis, database, services]
      when: "'redis' in enabled_services"

    # Applications
    - role: ../roles/apps/nextcloud
      tags: [nextcloud, services]
      when: "'nextcloud' in enabled_services"

    - role: ../roles/apps/immich
      tags: [immich, services]
      when: "'immich' in enabled_services"

    - role: ../roles/apps/jellyfin
      tags: [jellyfin, services]
      when: "'jellyfin' in enabled_services"

    - role: ../roles/apps/litopia
      tags: [litopia, services]
      when: "'litopia' in enabled_services"

    - role: ../roles/apps/backpaking
      tags: [backpaking, services]
      when: "'backpaking' in enabled_services"

    # Serveurs de jeu (AMP, natif)
    - role: ../roles/amp
      tags: [amp, services]
      when: "'amp' in enabled_services"
  post_tasks:
    - name: Résumé du déploiement
      ansible.builtin.debug:
        msg: "{{ ['Services déployés :'] + (service_domains | dict2items | map(attribute='value') | map('regex_replace', '^', '  https://') | list) }}"
