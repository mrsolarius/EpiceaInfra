---
# ========================================
# Variables communes à tous les environnements
# ========================================

timezone: "Europe/Paris"

# Propriétés Docker communes
docker_restart_policy: "always"
docker_monitoring_network_name: "monitoring"
docker_proxy_network_name: "traefik-proxy"

# ====================================================
# 1. RACINES PHYSIQUES (Où sont les disques ?)
# ====================================================
drive_nvme_path: "/opt/epicea"      # OS, configs, monitoring
drive_ssd_path: "/mnt/ssd_tank"     # Bases de données
drive_scratch_path: "/mnt/scratch"  # Caches jetables (transcodage, modèles ML)
drive_bulk_path: "/mnt/tank"        # Stockage de masse (pool ZFS tank)

# ====================================================
# 2. CHEMINS LOGIQUES (Qui utilise quoi ?)
# ====================================================
storage:
  # Chemins de base Ansible
  ansible:
    compose: "{{ drive_nvme_path }}/docker"
    configs: "{{ drive_nvme_path }}/config"

  # Applications nécessitant de la vitesse (NVMe)
  monitoring: "{{ drive_nvme_path }}/monitoring"

  # Bases de données (SSD)
  databases:
    immich: "{{ drive_ssd_path }}/immich-db"
    nextcloud: "{{ drive_ssd_path }}/nextcloud-db"
    redis: "{{ drive_ssd_path }}/redis"
    litopia: "{{ drive_ssd_path }}/litopia-db"
    backpaking: "{{ drive_ssd_path }}/backpaking-db"
    amp: "{{ drive_ssd_path }}/amp-db"

  # Caches jetables (SSD scratch, non sauvegardés)
  cache:
    jellyfin: "{{ drive_scratch_path }}/jellyfin-cache"
    immich_ml: "{{ drive_scratch_path }}/immich-ml-cache"

  # Stockage de masse (HDD)
  media:
    jellyfin_movies: "{{ drive_bulk_path }}/media/movies"
    jellyfin_shows: "{{ drive_bulk_path }}/media/shows"
    jellyfin_root: "{{ drive_bulk_path }}/media"
    immich_photos: "{{ drive_bulk_path }}/photos/immich"
    nextcloud_data: "{{ drive_bulk_path }}/cloud/data"
    backups: "{{ drive_bulk_path }}/backups"
    configs_backup: "{{ drive_bulk_path }}/backups/epicea-configs"
    backpaking_uploads: "{{ drive_bulk_path }}/apps/backpaking-uploads"

# ====================================================
# 3. PERMISSIONS (PUID/PGID)
# ====================================================
common_system_user: 1000
common_system_group: 1000
