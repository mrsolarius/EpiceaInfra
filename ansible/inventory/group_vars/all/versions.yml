---
# ========================================
# Versions des images Docker (Dictionnaire structuré)
# ========================================
# Renovate (renovate.json) propose les mises à jour en PR grâce aux commentaires
# « # renovate: » placés au-dessus de chaque version. Une version sans ce commentaire
# n'est pas suivie et se met à jour à la main.

docker_versions:
  # Infrastructure partagée
  common:
    # renovate: datasource=docker depName=tecnativa/docker-socket-proxy
    docker_socket_proxy: "v0.5.0"
    # renovate: datasource=docker depName=traefik
    traefik: "v3.7.16"
    # renovate: datasource=docker depName=postgres
    postgres: "16-alpine"
    # renovate: datasource=docker depName=redis
    redis: "8-alpine"
    # renovate: datasource=docker depName=prometheuscommunity/postgres-exporter
    postgres_exporter: "v0.20.1"
    # renovate: datasource=docker depName=oliver006/redis_exporter
    redis_exporter: "v1.96.0"

  # Stack Monitoring
  monitoring:
    # renovate: datasource=docker depName=prom/prometheus
    prometheus: "v3.15.1"
    # renovate: datasource=docker depName=prom/alertmanager
    alertmanager: "v0.34.1"
    # renovate: datasource=docker depName=gcr.io/cadvisor/cadvisor
    cadvisor: "v0.55.1"
    # renovate: datasource=docker depName=grafana/grafana
    grafana: "13.3.0"
    # renovate: datasource=docker depName=grafana/loki
    loki: "3.7.9"
    # renovate: datasource=docker depName=grafana/promtail
    promtail: "3.6.11"

  # Stack Immich (serveur et ML regroupés dans une même PR : ils doivent avoir la même version)
  immich:
    # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
    server: "v2.7.5"
    # renovate: datasource=docker depName=ghcr.io/immich-app/immich-machine-learning
    machine_learning: "v1.144.1"
    # Non suivi : format de tag que Renovate ne sait pas comparer, à aligner sur la doc d'Immich
    postgres: "16-vectorchord0.3.0-pgvectors0.3.0"

  # Autres Applications
  # renovate: datasource=docker depName=nextcloud
  nextcloud: "35.0.2"  # >= version de l'ancien serveur (pas de retour en arrière possible)
  # renovate: datasource=docker depName=jellyfin/jellyfin
  jellyfin: "10.11.11"
  amp:
    # renovate: datasource=docker depName=mysql
    mysql: "8.4"  # même version majeure que l'ancien serveur de jeu
  # Images privées GHCR : non suivies (Renovate aurait besoin d'un token read:packages)
  litopia:
    frontend: "v1.1.0"
    backend: "v1.1.0"
  backpaking:
    frontend: "v1.1.3"
    backend: "v2.1.2"
