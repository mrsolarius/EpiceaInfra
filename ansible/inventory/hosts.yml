---
all:
  children:
    # ====================
    # ENVIRONNEMENT PRODUCTION
    # ====================
    production:
      hosts:
        # Xeon E3-1275 v6, 64 Go DDR4
        # NVMe 1 To (OS) + SSD 1 To (BDD) + SSD 256 Go (cache) + 8 x HDD 4 To (RAIDZ2)
        srv-main:
          ansible_host: 192.168.1.100  # À MODIFIER POUR PRODUCTION
          ansible_user: ansible
          ansible_become: true
          ansible_python_interpreter: /usr/bin/python3

    # ====================
    # SERVEUR DE SAUVEGARDE
    # ====================
    backup:
      hosts:
        # Intel i7-6800K, 16 Go DDR3
        # NVMe Crucial E100 480 Go (OS) + 2 x HDD 26 To (miroir ZFS)
        srv-backup:
          ansible_host: 192.168.1.101  # À MODIFIER POUR PRODUCTION
          ansible_user: ansible
          ansible_become: true
          ansible_python_interpreter: /usr/bin/python3
