---
groups:
  - name: redis_alerts
    interval: 30s
    rules:
      # Redis Instance Down
      - alert: RedisDown
        expr: redis_up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: "Instance Redis indisponible 🔴"
          description: "L'instance Redis {{ $labels.instance }} est indisponible depuis plus d'une minute."

      # Low cache hit rate
      - alert: RedisLowCacheHitRate
        expr: |
          100 * rate(redis_keyspace_hits_total[5m]) /
          (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) < 80
        for: 10m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Faible taux de cache Redis 📉"
          description: "L'instance Redis {{ $labels.instance }} a un taux de cache de {{ $value }}% (devrait être > 80%). Vérifiez les modèles d'utilisation des clés."

      # High memory usage
      - alert: RedisHighMemoryUsage
        # Ignorée si maxmemory n'est pas défini (division par zéro -> +Inf)
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 90 and redis_memory_max_bytes > 0
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Utilisation mémoire Redis élevée 💾"
          description: "L'instance Redis {{ $labels.instance }} utilise {{ $value }}% de la mémoire maximale. Des clés pourraient commencer à être évincées."

      # Memory fragmentation
      - alert: RedisHighMemoryFragmentation
        expr: redis_memory_fragmentation_ratio > 2
        for: 10m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Fragmentation mémoire Redis élevée 🧩"
          description: "L'instance Redis {{ $labels.instance }} a un ratio de fragmentation de {{ $value }} (devrait être < 1.5). Envisagez de redémarrer Redis ou d'activer la défragmentation active."

      # Low memory fragmentation (possible issue)
      - alert: RedisLowMemoryFragmentation
        expr: redis_memory_fragmentation_ratio < 0.7
        for: 10m
        labels:
          severity: info
          component: redis
        annotations:
          summary: "Fragmentation mémoire Redis faible 📉"
          description: "L'instance Redis {{ $labels.instance }} a un ratio de fragmentation de {{ $value }} (< 0.7). Cela peut indiquer que des pages mémoire sont swappées sur le disque."

      # Keys being evicted
      - alert: RedisKeysEvicted
        expr: rate(redis_evicted_keys_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis évince des clés 🗑️"
          description: "L'instance Redis {{ $labels.instance }} évince {{ $value }} clés par seconde. Envisagez d'augmenter maxmemory ou de revoir les politiques TTL."

      # Too many connected clients
      - alert: RedisTooManyConnectedClients
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Trop de clients connectés à Redis 👥"
          description: "L'instance Redis {{ $labels.instance }} a {{ $value }} clients connectés. Vérifiez s'il y a des fuites de connexion."

      # Rejected connections
      - alert: RedisRejectedConnections
        expr: rate(redis_rejected_connections_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis rejette des connexions ⛔"
          description: "L'instance Redis {{ $labels.instance }} rejette {{ $value }} connexions par seconde. Envisagez d'augmenter maxclients."

      # Slow commands detected
      - alert: RedisSlowCommands
        expr: redis_slowlog_length > 10
        for: 5m
        labels:
          severity: info
          component: redis
        annotations:
          summary: "Commandes lentes Redis détectées 🐢"
          description: "L'instance Redis {{ $labels.instance }} a {{ $value }} commandes lentes dans le slowlog. Examinez et optimisez les opérations lentes."

      # RDB save failures
      - alert: RedisRDBSaveFailure
        expr: redis_rdb_last_save_timestamp_seconds < (time() - 3600) and redis_rdb_changes_since_last_save > 1000
        for: 10m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Sauvegarde RDB Redis non terminée récemment 💾"
          description: "L'instance Redis {{ $labels.instance }} n'a pas terminé de sauvegarde RDB depuis plus d'une heure, et a des changements en attente."

      # AOF rewrite in progress for too long
      - alert: RedisAOFRewriteTooLong
        expr: redis_aof_rewrite_in_progress == 1
        for: 30m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Réécriture AOF Redis trop longue â³"
          description: "L'instance Redis {{ $labels.instance }} réécrit l'AOF depuis plus de 30 minutes."

      # High command latency
      - alert: RedisHighCommandLatency
        expr: |
          (redis_command_duration_seconds_sum / redis_command_duration_seconds_count) * 1000000 > 10000
        for: 10m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Latence commande Redis élevée â±ï¸"
          description: "La commande {{ $labels.cmd }} sur l'instance Redis {{ $labels.instance }} a une latence moyenne de {{ $value }}µs (> 10ms)."

      # High CPU usage
      - alert: RedisHighCPUUsage
        expr: rate(redis_cpu_sys_seconds_total[5m]) * 100 + rate(redis_cpu_user_seconds_total[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Utilisation CPU Redis élevée 🔥"
          description: "L'instance Redis {{ $labels.instance }} utilise {{ $value }}% du CPU. Enquêtez sur les opérations coûteuses."

      # No keys in Redis
      - alert: RedisNoKeys
        expr: sum(redis_db_keys) == 0
        for: 10m
        labels:
          severity: info
          component: redis
        annotations:
          summary: "Redis n'a aucune clé 📭"
          description: "L'instance Redis {{ $labels.instance }} n'a aucune clé. Cela peut être normal pour une nouvelle instance ou indiquer un problème."

      # Master link down (replication)
      - alert: RedisMasterLinkDown
        expr: redis_master_link_up == 0
        for: 2m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: "Réplica Redis a perdu la connexion au maître 🔗"
          description: "Le réplica Redis {{ $labels.instance }} a perdu la connexion au maître depuis plus de 2 minutes."

      # Network saturation
      - alert: RedisHighNetworkTraffic
        expr: rate(redis_net_input_bytes_total[5m]) + rate(redis_net_output_bytes_total[5m]) > 100000000
        for: 10m
        labels:
          severity: info
          component: redis
        annotations:
          summary: "Trafic réseau Redis élevé 🌐"
          description: "L'instance Redis {{ $labels.instance }} gère {{ $value }} octets/s de trafic réseau. Surveillez les goulots d'étranglement potentiels."
