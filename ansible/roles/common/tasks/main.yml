---
# ========================================
# Role: common
# Description: Configuration systÃ¨me de base
# ========================================

- name: Mise Ã  jour du systÃ¨me
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    cache_valid_time: 3600

- name: Installation des paquets de base
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - ncdu
      - tree
      - jq
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
      - ufw
      - fail2ban
      - nfs-common
      - prometheus-node-exporter
      - smartmontools
    state: present

- name: Configuration du service Node Exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: started
    enabled: true

- name: Configuration du timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Configuration UFW - rÃ¨gles de base
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default('') }}"
  loop:
    - {rule: 'allow', port: '22', comment: 'SSH'}
    - {rule: 'allow', port: '80', comment: 'HTTP'}
    - {rule: 'allow', port: '443', comment: 'HTTPS'}

- name: Configuration UFW - autoriser Node Exporter depuis le rÃ©seau local et Docker
  community.general.ufw:
    rule: allow
    port: '9100'
    proto: tcp
    from_ip: "{{ item }}"
    comment: 'Allow Node Exporter'
  loop:
    - '192.168.1.0/24'
    - '172.16.0.0/12'

- name: Configuration UFW - bloquer accÃ¨s externe PostgreSQL, Redis et Node Exporter
  community.general.ufw:
    rule: deny
    port: "{{ item.port }}"
    proto: tcp
    comment: "{{ item.comment }}"
  loop:
    - {port: '5432', comment: 'Block external PostgreSQL'}
    - {port: '6379', comment: 'Block external Redis'}
    - {port: '9100', comment: 'Block external Node Exporter'}

- name: Configuration UFW - rÃ¨gles additionnelles (production)
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port | default(omit) }}"
    proto: "{{ item.proto | default('tcp') }}"
    from_ip: "{{ item.from | default(omit) }}"
    comment: "{{ item.comment | default('') }}"
  loop: "{{ ufw_additional_rules | default([]) }}"
  when: deploy_environment == 'production'

- name: Activation UFW
  community.general.ufw:
    state: enabled

- name: Configuration fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  when: fail2ban_enabled | default(true)

- name: Configuration DNS local (test uniquement)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 {{ item.value }}"
    state: present
  loop: "{{ service_domains | dict2items }}"
  when: deploy_environment == 'test'

- name: Installer drivers NVIDIA (production avec GPU)
  ansible.builtin.apt:
    name:
      - nvidia-driver-{{ gpu_driver_version }}
      - nvidia-container-toolkit
    state: present
    update_cache: true
  when:
    - deploy_environment == 'production'
    - system_enable_gpu | bool
  notify: Reboot system

- name: VÃ©rifier la prÃ©sence de la clÃ© privÃ©e SSH
  ansible.builtin.stat:
    path: "/home/{{ common_system_user }}/.ssh/id_rsa"
  register: ssh_private_key

- name: VÃ©rifier les permissions des clÃ©s privÃ©es SSH (si existantes)
  ansible.builtin.file:
    path: "/home/{{ common_system_user }}/.ssh/id_rsa"
    mode: '0600'
    state: file
  when: ssh_private_key.stat.exists | default(false)

- name: Afficher rÃ©sumÃ© configuration
  ansible.builtin.debug:
    msg:
      - "âœ… Paquets de base installÃ©s"
      - "âœ… Firewall UFW configurÃ©"
      - "âœ… Fail2ban activÃ©"
      - "{% if deploy_environment == 'test' %}âœ… DNS local configurÃ©{% endif %}"
      - "{% if system_enable_gpu %}âœ… Drivers NVIDIA installÃ©s{% endif %}"
