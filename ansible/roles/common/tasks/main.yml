---
# ========================================
# Role: common
# Description: Configuration système de base
# ========================================

- name: Mise à jour du système
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    cache_valid_time: 3600

- name: Installation des paquets de base
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - ncdu
      - tree
      - jq
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
      - ufw
      - fail2ban
      - prometheus-node-exporter
      - smartmontools
    state: present

- name: Configuration du service Node Exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: started
    enabled: true

- name: Configuration du timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Configuration UFW - règles de base
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default('') }}"
  loop:
    - {rule: 'allow', port: '22', comment: 'SSH'}
    - {rule: 'allow', port: '80', comment: 'HTTP'}
    - {rule: 'allow', port: '443', comment: 'HTTPS'}

# Node exporter (9100) : LAN et réseaux Docker uniquement. UFW refuse le reste par défaut.
- name: Configuration UFW - autoriser Node Exporter depuis le réseau local et Docker
  community.general.ufw:
    rule: allow
    port: '9100'
    proto: tcp
    from_ip: "{{ item }}"
    comment: 'Allow Node Exporter'
  loop:
    - '192.168.1.0/24'
    - '172.16.0.0/12'

- name: Configuration UFW - règles additionnelles
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port | default(omit) }}"
    proto: "{{ item.proto | default('tcp') }}"
    from_ip: "{{ item.from | default(omit) }}"
    comment: "{{ item.comment | default('') }}"
  loop: "{{ ufw_additional_rules | default([]) }}"

- name: Activation UFW
  community.general.ufw:
    state: enabled

- name: Configuration fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  when: fail2ban_enabled | default(true)
