---
# ========================================
# Role: docker
# Description: Installation + configuration Docker
# ========================================

- name: Supprimer les anciennes versions de Docker
  ansible.builtin.apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent

- name: Installer les dépendances pour le repository Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Créer le dossier pour les clés GPG
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Télécharger la clé GPG officielle Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Dearmor la clé GPG Docker
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc
    creates: /etc/apt/keyrings/docker.gpg

- name: Ajouter le repository Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present
    filename: docker

- name: Mettre à jour le cache APT
  ansible.builtin.apt:
    update_cache: true

- name: Installer Docker Engine (dernière version)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Créer le dossier de configuration Docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: Configurer Docker daemon (log rotation)
  ansible.builtin.copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_daemon_log_max_size }}",
          "max-file": "{{ docker_daemon_log_max_file }}"
        }
      }
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: Restart docker

- name: Ajouter utilisateur au groupe docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

# Si Docker a échoué en boucle (pool ZFS absent au démarrage), systemd refuse de
# le relancer tant que son compteur d'échecs n'est pas remis à zéro
- name: Remettre à zéro les échecs de démarrage de Docker
  ansible.builtin.command: systemctl reset-failed docker.service docker.socket
  changed_when: false
  failed_when: false

- name: Démarrer et activer Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Créer le réseau {{ docker_proxy_network_name }}
  community.docker.docker_network:
    name: "{{ docker_proxy_network_name }}"
    driver: bridge
    state: present

- name: Créer le réseau {{ docker_monitoring_network_name }}
  community.docker.docker_network:
    name: "{{ docker_monitoring_network_name }}"
    driver: bridge
    state: present
