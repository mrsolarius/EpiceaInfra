---
# ========================================
# Role: docker
# Description: Installation + configuration Docker
# ========================================

- name: VÃ©rifier si Docker est dÃ©jÃ  installÃ©
  ansible.builtin.command: docker --version
  register: docker_check
  failed_when: false
  changed_when: false

- name: Afficher la version Docker actuelle (si installÃ©e)
  ansible.builtin.debug:
    msg: "Docker dÃ©jÃ  installÃ© : {{ docker_check.stdout }}"
  when: docker_check.rc == 0

- name: Supprimer les anciennes versions de Docker
  ansible.builtin.apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent
  when: docker_check.rc != 0

- name: Installer les dÃ©pendances pour le repository Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: CrÃ©er le dossier pour les clÃ©s GPG
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Télécharger la clé GPG officielle Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false
  when: docker_check.rc != 0

- name: Dearmor la clé GPG Docker
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc
    creates: /etc/apt/keyrings/docker.gpg
  when: docker_check.rc != 0

- name: Ajouter le repository Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present
    filename: docker
  when: docker_check.rc != 0

- name: Mettre Ã  jour le cache APT
  ansible.builtin.apt:
    update_cache: true
  when: docker_check.rc != 0

- name: Installer Docker Engine (derniÃ¨re version)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest  # â† Force la derniÃ¨re version
    update_cache: true

- name: CrÃ©er le dossier de configuration Docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: Configurer Docker daemon (log rotation)
  ansible.builtin.copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_daemon_log_max_size }}",
          "max-file": "{{ docker_daemon_log_max_file }}"
        }{% if system_enable_gpu | bool %},
        "runtimes": {
          "nvidia": {
            "path": "nvidia-container-runtime",
            "runtimeArgs": []
          }
        },
        "default-runtime": "nvidia"{% endif %}
      }
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart docker

- name: Ajouter utilisateur au groupe docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: DÃ©marrer et activer Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: CrÃ©er le rÃ©seau {{ docker_proxy_network_name }}
  community.docker.docker_network:
    name: "{{ docker_proxy_network_name }}"
    driver: bridge
    state: present

- name: CrÃ©er le rÃ©seau {{ docker_monitoring_network_name }}
  community.docker.docker_network:
    name: "{{ docker_monitoring_network_name }}"
    driver: bridge
    state: present

- name: VÃ©rifier Docker fonctionne
  ansible.builtin.command: docker ps
  changed_when: false

- name: RÃ©cupÃ©rer la version Docker installÃ©e
  ansible.builtin.command: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
  register: docker_version_installed
  changed_when: false

- name: RÃ©cupÃ©rer l'API version Docker
  ansible.builtin.command: docker version --format '{{ "{{" }}.Server.APIVersion{{ "}}" }}'
  register: docker_api_version
  changed_when: false

- name: Afficher rÃ©sultat
  ansible.builtin.debug:
    msg:
      - "âœ… Docker installÃ© : {{ docker_version_installed.stdout }}"
      - "âœ… Docker API version : {{ docker_api_version.stdout }}"
      - "RÃ©seau Proxy : {{ docker_proxy_network_name }}"
      - "RÃ©seau Monitoring : {{ docker_monitoring_network_name }}"
      - "{% if docker_api_version.stdout is version('1.44', '>=') %}âœ… Compatible avec Traefik v3.3+{% else %}âš ï¸  API trop ancienne pour Traefik v3.3 (minimum 1.44){% endif %}"