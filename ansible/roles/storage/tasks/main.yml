---
# ========================================
# Role: storage
# Description: Arborescence de stockage et copie des configs
# ========================================
# Les pools/datasets ZFS sont créés au préalable par le rôle "zfs".

- name: Créer les racines de stockage
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ common_system_user }}"
    group: "{{ common_system_group }}"
  loop:
    - "{{ drive_nvme_path }}"
    - "{{ drive_ssd_path }}"
    - "{{ drive_scratch_path }}"
    - "{{ drive_bulk_path }}"
    - "{{ storage.ansible.compose }}"
    - "{{ storage.ansible.configs }}"
    - "{{ storage.monitoring }}"

- name: Créer les dossiers pour les bases de données (SSD)
  ansible.builtin.file:
    path: "{{ item.value }}"
    state: directory
    mode: '0700'
  loop: "{{ storage.databases | dict2items }}"

- name: Créer les dossiers de cache (SSD scratch)
  ansible.builtin.file:
    path: "{{ item.value }}"
    state: directory
    mode: '0755'
    owner: "{{ common_system_user }}"
    group: "{{ common_system_group }}"
  loop: "{{ storage.cache | dict2items }}"

# ----------------------------------------
# Copie des configs (NVMe hors ZFS) vers le stockage de masse
# ----------------------------------------
# /opt/epicea n'est pas sur ZFS : on le recopie chaque nuit dans tank/backups
# pour qu'il soit snapshoté par sanoid puis répliqué vers srv-backup.
- name: Configurer la copie quotidienne des configs
  when: backup_system_enabled | default(false) | bool
  block:
    - name: Installer rsync
      ansible.builtin.apt:
        name: rsync
        state: present

    - name: Créer le dossier de copie des configs
      ansible.builtin.file:
        path: "{{ storage.media.configs_backup }}"
        state: directory
        mode: '0700'

    - name: Planifier la copie des configs
      ansible.builtin.cron:
        name: "epicea-configs-backup"
        cron_file: epicea-configs-backup
        user: root
        minute: "{{ backup_system_schedule.split()[0] }}"
        hour: "{{ backup_system_schedule.split()[1] }}"
        day: "{{ backup_system_schedule.split()[2] }}"
        month: "{{ backup_system_schedule.split()[3] }}"
        weekday: "{{ backup_system_schedule.split()[4] }}"
        job: >-
          rsync -aHAX --delete
          --exclude 'monitoring/prometheus/' --exclude 'monitoring/loki/'
          {{ drive_nvme_path }}/ {{ storage.media.configs_backup }}/

- name: Vérifier l'espace disponible
  ansible.builtin.command: df -h {{ drive_ssd_path }} {{ drive_scratch_path }} {{ drive_bulk_path }}
  changed_when: false
  register: storage_df

- name: Afficher résumé stockage
  ansible.builtin.debug:
    msg: "{{ storage_df.stdout_lines }}"
