---
# ========================================
# Role: storage
# Description: Montages NFS + configuration stockage
# ========================================

- name: CrÃ©er les racines de stockage
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ common_system_user }}"
    group: "{{ common_system_group }}"
  loop:
    - "{{ drive_nvme_path }}"
    - "{{ drive_ssd_path }}"
    - "{{ drive_nfs_root }}"
    - "{{ storage.ansible.compose }}"
    - "{{ storage.ansible.configs }}"
    - "{{ storage.monitoring }}"

- name: CrÃ©er les dossiers pour les bases de donnÃ©es (SSD)
  ansible.builtin.file:
    path: "{{ item.value }}"
    state: directory
    mode: '0700'
  loop: "{{ storage.databases | dict2items }}"

- name: CrÃ©er les points de montage NFS
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0755'
  loop: "{{ nfs_mounts }}"

- name: Monter les partages NFS
  ansible.posix.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    fstype: nfs
    opts: "{{ item.opts }}"
    state: mounted
  loop: "{{ nfs_mounts }}"

- name: Configurer les permissions aprÃ¨s montage
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.mode | default(omit) }}"
  loop: "{{ nfs_mounts }}"
  when: item.owner is defined or item.group is defined or item.mode is defined

- name: VÃ©rifier les montages
  ansible.builtin.command: df -h {{ item.path }}
  loop: "{{ nfs_mounts }}"
  changed_when: false
  register: nfs_check

- name: Afficher rÃ©sumÃ© stockage
  ansible.builtin.debug:
    msg:
      - "âœ… Montages NFS configurÃ©s :"
      - "{% for mount in nfs_mounts %}  - {{ mount.path }} â†’ {{ mount.src }}{% endfor %}"
