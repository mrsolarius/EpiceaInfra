---
# ========================================
# Role: redis
# Description: Redis partagé (cache Nextcloud, files de tâches Immich)
# ========================================

- name: Créer les répertoires pour Redis (propriétaire user)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ common_system_user }}"
    group: "{{ common_system_group }}"
  loop:
    - "{{ storage.databases.redis }}"
    - "{{ storage.ansible.compose }}/redis"

- name: Créer le répertoire de données pour Redis (propriétaire redis)
  ansible.builtin.file:
    path: "{{ storage.databases.redis }}/data"
    state: directory
    mode: '0755'
    owner: "999"
    group: "{{ common_system_group }}"

- name: Générer le fichier .env pour Redis
  ansible.builtin.template:
    src: redis.env.j2
    dest: "{{ storage.ansible.compose }}/redis/.env"
    mode: '0600'

# Un ancien déploiement montait redis.conf sans le générer : Docker avait créé
# un dossier vide à sa place
- name: Vérifier le fichier redis.conf
  ansible.builtin.stat:
    path: "{{ storage.ansible.compose }}/redis/redis.conf"
  register: redis_conf

- name: Supprimer le dossier redis.conf créé par erreur
  ansible.builtin.file:
    path: "{{ storage.ansible.compose }}/redis/redis.conf"
    state: absent
  when: redis_conf.stat.isdir | default(false)

- name: Générer redis.conf
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ storage.ansible.compose }}/redis/redis.conf"
    mode: '0644'
  register: redis_conf_file

- name: Copier le docker-compose pour Redis
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ storage.ansible.compose }}/redis/docker-compose.yml"
    mode: '0644'
    trim_blocks: true
    lstrip_blocks: true

- name: Démarrer la stack Redis
  community.docker.docker_compose_v2:
    project_src: "{{ storage.ansible.compose }}/redis"
    state: present
    pull: always
    recreate: "{{ 'always' if redis_conf_file is changed else 'auto' }}"
    wait: true
    wait_timeout: 120
