---
- name: Détecter Quick Sync (iGPU du CPU)
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: jellyfin_render_node
  when: jellyfin_quicksync | default(false) | bool

- name: Récupérer le groupe render
  ansible.builtin.getent:
    database: group
    key: render
    fail_key: false
  when: jellyfin_render_node.stat.exists | default(false)

- name: Activer Quick Sync si disponible
  ansible.builtin.set_fact:
    jellyfin_hwaccel_enabled: "{{ (jellyfin_render_node.stat.exists | default(false)) and (ansible_facts.getent_group.render | default(none)) is not none }}"
    jellyfin_render_gid: "{{ (ansible_facts.getent_group.render | default(['', '']))[1] }}"

- name: Signaler l'absence de Quick Sync
  ansible.builtin.debug:
    msg: "Quick Sync demandé mais /dev/dri/renderD128 absent : activer l'IGD dans le BIOS. Jellyfin transcode en CPU."
  when:
    - jellyfin_quicksync | default(false) | bool
    - not jellyfin_hwaccel_enabled | bool

- name: Déployer Jellyfin
  ansible.builtin.import_role:
    name: app_stack
  vars:
    app_name: jellyfin
    app_files:
      - {src: jellyfin.env.j2, dest: .env, mode: '0600'}
      - {src: docker-compose.yml.j2, dest: docker-compose.yml}
