---
- name: Créer les répertoires de données
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ common_system_user }}"
    group: "{{ common_system_group }}"
  loop:
    - "{{ storage.ansible.compose }}/jellyfin"

- name: Générer le fichier .env
  ansible.builtin.template:
    src: jellyfin.env.j2
    dest: "{{ storage.ansible.compose }}/jellyfin/.env"
    mode: '0600'

- name: Générer le fichier docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ storage.ansible.compose }}/jellyfin/docker-compose.yml"
    mode: '0644'
    trim_blocks: true
    lstrip_blocks: true

- name: Démarrer Jellyfin
  community.docker.docker_compose_v2:
    project_src: "{{ storage.ansible.compose }}/jellyfin"
    state: present
    pull: always

- name: Attendre que Jellyfin soit prêt
  ansible.builtin.shell:
    cmd: docker compose ps --format json | jq -r '.Health' | grep -c healthy || true
    chdir: "{{ storage.ansible.compose }}/jellyfin"
  register: jellyfin_health
  until: jellyfin_health.stdout | int > 0
  retries: 12
  delay: 5
  changed_when: false

