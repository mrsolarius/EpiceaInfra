---
- name: Créer les répertoires de données
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ common_system_user }}"
    group: "{{ common_system_group }}"
  loop:
    - "{{ storage.ansible.compose }}/jellyfin"

# Transcodage matériel via Quick Sync, intégré au Xeon (pas de carte graphique).
# Activé seulement si le noyau expose le périphérique (IGD activé dans le BIOS).
- name: Détecter Quick Sync (iGPU du CPU)
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: jellyfin_render_node
  when: jellyfin_quicksync | default(false) | bool

- name: Récupérer le groupe render
  ansible.builtin.getent:
    database: group
    key: render
    fail_key: false
  when: jellyfin_render_node.stat.exists | default(false)

- name: Activer Quick Sync si disponible
  ansible.builtin.set_fact:
    jellyfin_hwaccel_enabled: "{{ (jellyfin_render_node.stat.exists | default(false)) and (ansible_facts.getent_group.render | default(none)) is not none }}"
    jellyfin_render_gid: "{{ (ansible_facts.getent_group.render | default(['', '']))[1] }}"

- name: Signaler l'absence de Quick Sync
  ansible.builtin.debug:
    msg: "Quick Sync demandé mais /dev/dri/renderD128 absent : activer l'IGD dans le BIOS. Jellyfin transcode en CPU."
  when:
    - jellyfin_quicksync | default(false) | bool
    - not jellyfin_hwaccel_enabled | bool

- name: Générer le fichier .env
  ansible.builtin.template:
    src: jellyfin.env.j2
    dest: "{{ storage.ansible.compose }}/jellyfin/.env"
    mode: '0600'

- name: Générer le fichier docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ storage.ansible.compose }}/jellyfin/docker-compose.yml"
    mode: '0644'
    trim_blocks: true
    lstrip_blocks: true

- name: Démarrer Jellyfin
  community.docker.docker_compose_v2:
    project_src: "{{ storage.ansible.compose }}/jellyfin"
    state: present
    pull: always
    wait: true
    wait_timeout: 600
