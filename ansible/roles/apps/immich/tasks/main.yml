---
- name: Déployer Immich
  ansible.builtin.import_role:
    name: app_stack
  vars:
    app_name: immich
    app_database: true
    app_files:
      - {src: init-db.sql.j2, dest: init-immich-db.sql}
      - {src: immich.env.j2, dest: .env, mode: '0600'}
      - {src: docker-compose.yml.j2, dest: docker-compose.yml}
