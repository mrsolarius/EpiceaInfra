---
- name: Déployer Litopia
  ansible.builtin.import_role:
    name: app_stack
  vars:
    app_name: litopia
    app_database: true
    app_ghcr_login: true
    app_files:
      - {src: litopia-back.env.j2, dest: .env, mode: '0600'}
      - {src: litopia-front.env.j2, dest: litopia-front.env}
      - {src: docker-compose.yml.j2, dest: docker-compose.yml}
