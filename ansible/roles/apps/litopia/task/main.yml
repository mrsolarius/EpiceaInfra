---
- name: CrÃ©er les rÃ©pertoires Litopia
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ common_system_user }}"
    group: "{{ common_system_group }}"
  loop:
    - "{{ storage.ansible.compose }}/litopia"

- name: CrÃ©er les rÃ©pertoires de donnÃ©es PostgreSQL Litopia
  ansible.builtin.file:
    path: "{{ storage.databases.litopia }}"
    state: directory
    mode: '0700'
    owner: "999" # postgres
    group: "999"
    recurse: yes

- name: GÃ©nÃ©rer le fichier .env Litopia (backend + DB)
  ansible.builtin.template:
    src: "{{ role_path }}/template/litopia-back.env.j2"
    dest: "{{ storage.ansible.compose }}/litopia/.env"
    mode: '0600'

- name: GÃ©nÃ©rer le fichier .env Litopia (frontend)
  ansible.builtin.template:
    src: "{{ role_path }}/template/litopia-front.env.j2"
    dest: "{{ storage.ansible.compose }}/litopia/litopia-front.env"
    mode: '0644'

- name: Copier les requÃªtes personnalisÃ©es postgres-exporter
  ansible.builtin.copy:
    src: ../../../monitoring/files/postgres-exporter-queries.yaml
    dest: "{{ storage.ansible.compose }}/litopia/postgres-exporter-queries.yaml"
    mode: '0644'

- name: GÃ©nÃ©rer le fichier docker-compose Litopia
  ansible.builtin.template:
    src: "{{ role_path }}/template/docker-compose.yml.j2"
    dest: "{{ storage.ansible.compose }}/litopia/docker-compose.yml"
    mode: '0644'
    trim_blocks: true
    lstrip_blocks: true

- name: Login to GHCR (optional)
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_token }}"
    reauthorize: true
  no_log: true
  when:
    - (ghcr_username | default('')) | length > 0
    - (ghcr_token | default('')) | length > 0

- name: DÃ©marrer Litopia
  community.docker.docker_compose_v2:
    project_src: "{{ storage.ansible.compose }}/litopia"
    state: present
    pull: always

- name: Attendre que Litopia soit prÃªt
  ansible.builtin.shell:
    cmd: docker compose ps --format json | jq -r '.Health' | grep -c healthy || true
    chdir: "{{ storage.ansible.compose }}/litopia"
  register: litopia_health
  until: litopia_health.stdout | int >= 3
  retries: 24
  delay: 5
  changed_when: false

- name: Logout from GHCR after Litopia (optional)
  community.docker.docker_login:
    registry_url: ghcr.io
    state: absent
  when:
    - (ghcr_username | default('')) | length > 0
    - (ghcr_token | default('')) | length > 0
