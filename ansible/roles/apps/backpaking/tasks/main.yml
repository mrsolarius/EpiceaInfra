---
# L'image tourne en appuser (10001:999) et écrit dans /app/uploads
- name: Créer le répertoire des uploads Backpaking
  ansible.builtin.file:
    path: "{{ storage.media.backpaking_uploads }}"
    state: directory
    mode: '0755'
    owner: "10001"
    group: "999"

# Le .env du backend sert aussi à Docker Compose (variables de la base) : généré deux fois
- name: Déployer Backpaking
  ansible.builtin.import_role:
    name: app_stack
  vars:
    app_name: backpaking
    app_database: true
    app_ghcr_login: true
    app_files:
      - {src: backpaking-back.env.j2, dest: backpaking-back.env, mode: '0600'}
      - {src: backpaking-back.env.j2, dest: .env, mode: '0600'}
      - {src: backpaking-front.env.j2, dest: backpaking-front.env}
      - {src: docker-compose.yml.j2, dest: docker-compose.yml}
