- name: Créer les répertoires de données Nextcloud
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "33" # www-data
    group: "33"
  loop:
    - "{{ storage.ansible.compose }}/nextcloud"

- name: Créer les répertoires de données PostgreSQL Nextcloud
  ansible.builtin.file:
    path: "{{ storage.databases.nextcloud }}"
    state: directory
    mode: '0700'
    owner: "999" # postgres
    group: "999"
    recurse: yes

- name: Générer le script d'initialisation PostgreSQL
  ansible.builtin.template:
    src: init-db.sql.j2
    dest: "{{ storage.ansible.compose }}/nextcloud/init-db.sql"
    mode: '0644'

- name: Générer le fichier .env
  ansible.builtin.template:
    src: nextcloud.env.j2
    dest: "{{ storage.ansible.compose }}/nextcloud/.env"
    mode: '0600'

- name: Copier les requêtes personnalisées postgres-exporter
  ansible.builtin.copy:
    src: ../../../monitoring/files/postgres-exporter-queries.yaml
    dest: "{{ storage.ansible.compose }}/nextcloud/postgres-exporter-queries.yaml"
    mode: '0644'

- name: Générer le fichier docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ storage.ansible.compose }}/nextcloud/docker-compose.yml"
    mode: '0644'
    trim_blocks: true
    lstrip_blocks: true

- name: Démarrer Nextcloud
  community.docker.docker_compose_v2:
    project_src: "{{ storage.ansible.compose }}/nextcloud"
    state: present
    pull: always

- name: Attendre que Nextcloud soit prêt
  ansible.builtin.shell:
    cmd: docker compose ps --format json | jq -r '.Health' | grep -c healthy || true
    chdir: "{{ storage.ansible.compose }}/nextcloud"
  register: nextcloud_health
  until: nextcloud_health.stdout | int > 0
  retries: 24
  delay: 5
  changed_when: false

- name: Vérifier si Nextcloud est déjà configuré
  community.docker.docker_container_exec:
    container: nextcloud
    command: php occ status
  register: occ_status
  until: occ_status is not failed
  retries: 5
  delay: 5
  failed_when: false
  changed_when: false

- name: Appliquer la configuration système Nextcloud via occ
  community.docker.docker_container_exec:
    container: nextcloud
    command: >
      /bin/sh -lc "php occ config:system:set dbhost --value='nextcloud-db:5432' &&
      php occ config:system:set dbtype --value='pgsql' &&
      php occ config:system:set overwrite.cli.url --value='https://{{ service_domains.nextcloud }}' &&
      php occ config:system:set overwriteprotocol --value='https' &&
      php occ config:system:set redis host --value='redis' &&
      php occ config:system:set filelocking.enabled --value='true' --type=boolean &&
      php occ config:system:set memcache.distributed --value='\OC\Memcache\Redis' &&
      php occ config:system:set memcache.locking --value='\OC\Memcache\Redis' &&
      php occ config:system:set xframe_options_action --value='SAMEORIGIN'"
  register: occ_config
  until: occ_config is not failed
  retries: 5
  delay: 5
  failed_when: false
  changed_when: "occ_config.stdout is defined and 'system configuration value' in occ_config.stdout"
  when: occ_status is defined and occ_status.rc is defined and occ_status.rc == 0

- name: Mettre à jour la base de données (upgrade)
  community.docker.docker_container_exec:
    container: nextcloud
    command: php occ upgrade
  register: occ_upgrade
  until: occ_upgrade is not failed
  retries: 5
  delay: 5
  failed_when: false
  changed_when: "occ_upgrade.stdout is defined and 'Nextcloud is already latest version' not in occ_upgrade.stdout"
  when: occ_status is defined and occ_status.rc is defined and occ_status.rc == 0
