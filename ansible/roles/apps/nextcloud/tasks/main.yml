---
- name: Déployer Nextcloud
  ansible.builtin.import_role:
    name: app_stack
  vars:
    app_name: nextcloud
    app_owner: "33"  # www-data
    app_group: "33"
    app_database: true
    app_files:
      - {src: init-db.sql.j2, dest: init-db.sql}
      - {src: nextcloud.env.j2, dest: .env, mode: '0600'}
      - {src: docker-compose.yml.j2, dest: docker-compose.yml}

- name: Vérifier si Nextcloud est déjà configuré
  community.docker.docker_container_exec:
    container: nextcloud
    command: php occ status
  register: occ_status
  until: occ_status is not failed
  retries: 5
  delay: 5
  failed_when: false
  changed_when: false

- name: Appliquer la configuration système Nextcloud via occ
  community.docker.docker_container_exec:
    container: nextcloud
    command: >
      /bin/sh -lc "php occ config:system:set dbhost --value='nextcloud-db:5432' &&
      php occ config:system:set dbtype --value='pgsql' &&
      php occ config:system:set overwrite.cli.url --value='https://{{ service_domains.nextcloud }}' &&
      php occ config:system:set overwriteprotocol --value='https' &&
      php occ config:system:set redis host --value='redis' &&
      php occ config:system:set filelocking.enabled --value='true' --type=boolean &&
      php occ config:system:set memcache.distributed --value='\OC\Memcache\Redis' &&
      php occ config:system:set memcache.locking --value='\OC\Memcache\Redis' &&
      php occ config:system:set xframe_options_action --value='SAMEORIGIN'"
  register: occ_config
  until: occ_config is not failed
  retries: 5
  delay: 5
  failed_when: false
  changed_when: "occ_config.stdout is defined and 'system configuration value' in occ_config.stdout"
  when: occ_status is defined and occ_status.rc is defined and occ_status.rc == 0

- name: Mettre à jour la base de données (upgrade)
  community.docker.docker_container_exec:
    container: nextcloud
    command: php occ upgrade
  register: occ_upgrade
  until: occ_upgrade is not failed
  retries: 5
  delay: 5
  failed_when: false
  changed_when: "occ_upgrade.stdout is defined and 'Nextcloud is already latest version' not in occ_upgrade.stdout"
  when: occ_status is defined and occ_status.rc is defined and occ_status.rc == 0
